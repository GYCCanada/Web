name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read #  to fetch code (actions/checkout)
  packages: write # to push the image to GHCR (docker job, main only)

jobs:
  build:
    timeout-minutes: 20

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: gycc_test
          POSTGRES_PASSWORD: gycc
          POSTGRES_USER: gycc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gycc -d gycc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # effect-tsgo patch runs via the `prepare` lifecycle script on install.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgres://gycc:gycc@localhost:5432/gycc_test
        run: bun run test:postgres

  docker:
    needs: build
    timeout-minutes: 20

    runs-on: ubuntu-latest

    # ghcr.io/gyccanada/web — owner lowercased (GHCR rejects mixed-case repo
    # names). github.repository_owner is "GYCCanada", so lowercase it here.
    env:
      IMAGE: ghcr.io/gyccanada/web

    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: gycc
          POSTGRES_PASSWORD: gycc
          POSTGRES_USER: gycc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gycc -d gycc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Tags: `:sha-<short>` always; add `:latest` only on a push to main.
      # Explicit labels override the ones metadata-action infers from the repo —
      # the GitHub description is still the stale monorepo blurb.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.description=GYC Canada site

      # Build once, load into the local daemon so the smoke test runs on the
      # exact image we publish. Pushing happens in a later step (main only).
      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Production boot fail-fasts without MAIL_* or TOAST_COOKIE_SECRET (see
      # .env.example, ADR 0004); dummies let the container boot during smoke.
      # `meta.outputs.version` is the primary tag name the metadata-action chose
      # (e.g. sha-d5e414a) — a single value, unlike outputs.tags which is
      # multiline on main. Run the exact image we just loaded.
      - name: Boot + smoke (/healthz, /, /fr)
        run: |
          docker run -d --name gycc -p 3000:3000 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgres://gycc:gycc@host.docker.internal:5432/gycc \
            -e MAIL_HOST=smtp.example.com -e MAIL_PORT=587 \
            -e MAIL_USER=ci -e MAIL_PASS=ci \
            -e MAIL_FROM=ci@example.com -e MAIL_TO=ci@example.com \
            -e REGISTRATION_ALERT_EMAIL=registration-ci@example.com \
            -e TOAST_COOKIE_SECRET=ci-toast-secret \
            "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/healthz && break
            sleep 1
          done
          curl -sf http://localhost:3000/healthz
          curl -sf -o /dev/null http://localhost:3000/
          curl -sf -o /dev/null http://localhost:3000/fr
          curl -sf -o /dev/null http://localhost:3000/2026/form

      - name: Container logs
        if: always()
        run: docker logs gycc || true

      # Publish only after the smoke test passes, and only on main. PRs build +
      # smoke-test but never push.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Surface the deployable refs in the run's Summary tab so the exact tag +
      # immutable digest are one click away — no log-digging. meta.outputs.tags
      # is newline-separated (`:sha-<short>` + `:latest` on main).
      - name: Image summary
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo "Pull a tag, or pin the digest for an immutable deploy:"
            echo
            echo '| Ref | |'
            echo '| --- | --- |'
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "| \`$tag\` | tag |"
            done <<< "$TAGS"
            echo "| \`${IMAGE}@${DIGEST}\` | digest |"
          } >> "$GITHUB_STEP_SUMMARY"
